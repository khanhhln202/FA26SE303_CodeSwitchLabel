# Bản chạy trên máy chủ. Khác bản dev ở bốn điểm:
#   - Chỉ Caddy mở cổng ra Internet (80, 443); database và kho file chỉ nói chuyện trong mạng nội bộ.
#   - Mọi mật khẩu và khoá lấy từ file .env, không ghi trong file này.
#   - API chạy ASPNETCORE_ENVIRONMENT=Production, Swagger và dữ liệu mẫu bật bằng công tắc riêng.
#   - Container tự bật lại khi máy chủ khởi động lại.
#
# Chạy:  docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build

name: codeswitchlabel

# Log cua Docker mac dinh khong xoay vong: chay vai tuan la day dia may chu.
# Gioi han 3 file x 10 MB cho moi service, tong toi da 120 MB cho ca he.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    container_name: csl-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      FILES_DOMAIN: ${FILES_DOMAIN}
    logging: *logging
    volumes:
      # Mặc định hai tên miền (api.* và files.*). Chỉ có một tên miền thì đặt
      # CADDYFILE=./Caddyfile.one-host trong deploy/.env.
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # chứng chỉ HTTPS, mất là phải xin lại
      - caddy-config:/config
    depends_on:
      - api
      - minio

  postgres:
    image: postgres:16-alpine
    container_name: csl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codeswitchlabel
      POSTGRES_USER: csl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    logging: *logging
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Lược đồ chỉ chạy một lần, lúc database còn trống.
      - ../docs/codeswitchlabel.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csl -d codeswitchlabel"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    container_name: csl-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    logging: *logging
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Nhan dang giong noi chay ngay tren may nay thay vi goi dich vu ben ngoai. Ly do:
  # may chu dat o vung Azure East Asia (Hong Kong) nen Groq va OpenAI chan theo quoc gia,
  # con OpenRouter thi doi so du toi thieu. Anh nay noi dung giong OpenAI
  # /v1/audio/transcriptions nen WhisperAsrClient goi thang, khong phai sua code.
  #
  # Ghim theo digest chu khong theo tag: day la anh cua ben thu ba, mot ban cap nhat
  # am tham doi hop dong API la AI duyet chet ma khong ai biet vi sao.
  asr:
    image: ghcr.io/speaches-ai/speaches:latest-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    container_name: csl-asr
    restart: unless-stopped
    environment:
      # Nha model khoi RAM sau khi khong dung mot luc. Lan goi ke tiep phai nap lai,
      # do that la ~60 giay, nen ASR_TIMEOUT_SECONDS phai du rong cho ca lan nap do.
      WHISPER__TTL: ${ASR_MODEL_TTL:-300}
      # int8 la bat buoc: model tren dia la float16 ~1,5 GB, giu nguyen float16 thi
      # khong con nhet vua bo nho may chu.
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__INFERENCE_DEVICE: cpu
      ENABLE_UI: "false"
      # Khong tat Xet thi HuggingFace gom du lieu trong RAM luc tai, container bi giet
      # giua chung va de lai file model cut MA VAN TUONG LA DA TAI XONG -> phien am tra 500.
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    volumes:
      - asr-models:/home/ubuntu/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/models', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    # Tran RAM la thu bao ve csl-api. Cham tran thi Docker giet RIENG container nay,
    # da kiem chung that: container bi OOM hai lan ma csl-api khong khoi dong lai lan nao.
    # Do duoc: chay on dinh het 1,0 GB, nhung dinh nhat thoi luc nap model vuot 1,6 GB,
    # nen phai cho muon swap VA may chu bat buoc phai co swap.
    mem_limit: 1600m
    memswap_limit: 4000m
    logging: *logging

  api:
    build:
      context: ../backend
    image: codeswitchlabel-api:prod
    container_name: csl-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080

      # Mặc định EF Core in ra TOÀN BỘ câu SQL ở mức Information. Trên máy chủ thì đó là
      # rác chiếm đĩa và lộ cấu trúc truy vấn trong log. Cần xem lại thì đổi về Information,
      # chạy "docker compose ... up -d api", xem log, rồi đặt lại Warning.
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning

      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=codeswitchlabel;Username=csl;Password=${POSTGRES_PASSWORD}"

      Jwt__Issuer: "https://${API_DOMAIN}"
      Jwt__Audience: "https://${API_DOMAIN}"
      Jwt__Key: ${JWT_KEY}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-120}

      # ServiceUrl: API gọi MinIO trong mạng nội bộ. PublicUrl: địa chỉ trình duyệt tải file,
      # bắt buộc https vì trang frontend chạy https.
      ObjectStorage__ServiceUrl: "http://minio:9000"
      ObjectStorage__PublicUrl: "https://${FILES_DOMAIN}"
      ObjectStorage__AccessKey: ${MINIO_ROOT_USER}
      ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD}
      ObjectStorage__BucketName: recordings
      ObjectStorage__ForcePathStyle: "true"
      ObjectStorage__PresignedUrlMinutes: 15

      # LLM gán nhãn (OpenAI-compatible). Để trống thì backend gán nhãn bằng luật.
      # Giá trị thật nằm trong deploy/.env trên máy chủ, không commit.
      Llm__Endpoint: ${LLM_ENDPOINT:-}
      Llm__Model: ${LLM_MODEL:-}
      Llm__ApiKey: ${LLM_API_KEY:-}
      Llm__TimeoutSeconds: ${LLM_TIMEOUT_SECONDS:-60}
      Asr__Endpoint: ${ASR_ENDPOINT:-}
      Asr__Model: ${ASR_MODEL:-}
      Asr__ApiKey: ${ASR_API_KEY:-}
      Asr__Language: ${ASR_LANGUAGE:-}
      Asr__TimeoutSeconds: ${ASR_TIMEOUT_SECONDS:-120}

      # Trình duyệt chỉ cho frontend gọi API nếu origin nằm trong danh sách này.
      Cors__AllowedOrigins__0: ${FE_ORIGIN}
      Cors__AllowedOrigins__1: ${FE_ORIGIN_PREVIEW:-${FE_ORIGIN}}
      # Máy cá nhân của đội frontend, để họ trỏ thẳng vào máy chủ này thay vì phải
      # chạy backend trên máy mình. Bỏ trống ở bản chạy thật.
      Cors__AllowedOrigins__2: ${FE_ORIGIN_LOCAL:-${FE_ORIGIN}}

      # Máy chủ thử nghiệm cho đội frontend: bật Swagger và tạo dữ liệu mẫu.
      # Khi chuyển sang bản chạy thật, đặt Swagger__Enabled=false và bỏ trống Seed__DefaultPassword.
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      Seed__DefaultPassword: ${SEED_PASSWORD}
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pg-data:
  minio-data:
  asr-models:
  caddy-data:
  caddy-config:
