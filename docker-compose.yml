services:
  postgres:
    image: postgres:16-alpine
    container_name: csl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codeswitchlabel
      POSTGRES_USER: csl
      POSTGRES_PASSWORD: csl_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Lược đồ do nhóm chốt là nguồn sự thật duy nhất. PostgreSQL tự chạy file này
      # đúng một lần, lúc tạo database rỗng. Sửa lược đồ thì sửa file .sql rồi
      # `docker compose down -v` để dựng lại từ đầu.
      - ./docs/codeswitchlabel.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # API chờ tới khi database thật sự nhận kết nối, không chỉ khi container đã chạy.
      test: ["CMD-SHELL", "pg_isready -U csl -d codeswitchlabel"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Docker Hub đã gỡ image minio/minio (trả 404) và Bitnami đã rút bản của họ,
    # nên lấy từ kho chính chủ của MinIO trên quay.io.
    # Ghim đúng phiên bản thay vì dùng latest: kho này cũng có thể bị rút giữa kỳ —
    # ghim rõ thì cả nhóm luôn kéo về cùng một bản, và biết chính xác phải tìm lại bản nào.
    # Code không phụ thuộc MinIO: đổi sang server tương thích S3 khác chỉ cần sửa khối này và mục ObjectStorage.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    container_name: csl-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: csl_minio
      MINIO_ROOT_PASSWORD: csl_minio_dev_password
    ports:
      - "9000:9000"   # API tương thích S3
      # Cổng máy thật là 9090 chứ không phải 9001: Windows giữ riêng cổng 9001 cho tiến trình System
      # (xem bằng: netsh interface ipv4 show excludedportrange protocol=tcp), nên Docker không mở được.
      # Bên trong container MinIO vẫn chạy giao diện ở 9001 — chỉ đổi cổng phía máy thật.
      - "9090:9001"   # giao diện quản trị: http://localhost:9090
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # Chỉ bật khi gọi kèm --profile api, nên `docker compose up -d postgres minio` vẫn như cũ
    # cho người làm backend chạy `dotnet run`. Đội frontend chạy cả hệ thống bằng:
    #   docker compose --profile api up -d --build
    profiles: ["api"]
    build:
      context: ./backend
    image: codeswitchlabel-api:dev
    container_name: csl-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Môi trường Development: bật Swagger và nạp tài khoản demo, đúng thứ đội frontend cần.
      ASPNETCORE_ENVIRONMENT: Development
      # Trong mạng Docker, database và kho file được gọi bằng tên service, không phải localhost.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=codeswitchlabel;Username=csl;Password=csl_dev_password"
      ObjectStorage__ServiceUrl: "http://minio:9000"
      # Còn trình duyệt chỉ vào được localhost, nên link nghe tạm phải ký bằng địa chỉ này.
      ObjectStorage__PublicUrl: "http://localhost:9000"
    ports:
      - "5053:8080"   # cùng cổng với lúc chạy dotnet run — frontend không phải đổi cấu hình

volumes:
  postgres-data:
  minio-data:
